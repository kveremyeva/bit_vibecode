<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Воронка продаж — дашборд Битрикс24</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23052e25'/%3E%3Cpath d='M8 22 16 7l8 15H8z' fill='%2330d6a5'/%3E%3Cpath d='M12 20h8l-4-8-4 8z' fill='%23052e25'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="noise" aria-hidden="true"></div>

    <header class="masthead">
      <div class="masthead__inner">
        <a class="brand" href="/">
          <span class="brand__mark" aria-hidden="true">
            <svg viewBox="0 0 32 32" width="26" height="26">
              <path d="M8 22 16 7l8 15H8z" fill="#052e25" />
              <path d="M12 20h8l-4-8-4 8z" fill="#30d6a5" />
            </svg>
          </span>
          <span class="brand__text">
            <span class="brand__title">Воронка продаж</span>
            <span class="brand__sub">Bitrix24 · CRM</span>
          </span>
        </a>

        <div class="period-bar" id="periodBar" aria-label="Фильтр по периоду создания сделки">
          <div class="seg" data-period="today">Сегодня</div>
          <div class="seg" data-period="yesterday">Вчера</div>
          <div class="seg" data-period="week">Эта неделя</div>
          <div class="seg is-active" data-period="month">Этот месяц</div>
          <div class="seg" data-period="custom">Произвольный период</div>
          <div class="custom-range" id="customRange" hidden>
            <label class="field">
              <span>От</span>
              <input type="date" id="fromInput" />
            </label>
            <label class="field">
              <span>До</span>
              <input type="date" id="toInput" />
            </label>
          </div>
        </div>

        <button class="refresh" id="refreshBtn" title="Обновить данные">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12a9 9 0 1 1-2.64-6.36" />
            <path d="M21 3v6h-6" />
          </svg>
          <span>Обновить</span>
        </button>
      </div>
      <div class="strip" aria-hidden="true"></div>
    </header>

    <main class="shell" id="app">
      <section class="statusline" id="statusline">
        <span class="dot" id="statusDot"></span>
        <span id="statusText">Загружаю данные портала…</span>
      </section>

      <section class="kpis" id="kpis" aria-label="Ключевые показатели"></section>

      <div class="grid">
        <section class="panel panel--funnel" aria-label="Воронка по стадиям">
          <div class="panel__head">
            <div>
              <h2 class="panel__title">Воронка по стадиям</h2>
              <p class="panel__hint" id="funnelHint"></p>
            </div>
          </div>
          <div class="funnel" id="funnel"></div>
        </section>

        <section class="panel panel--recent" aria-label="Последние сделки">
          <div class="panel__head">
            <div>
              <h2 class="panel__title">Последние сделки</h2>
              <p class="panel__hint" id="recentHint"></p>
            </div>
          </div>
          <div class="table-wrap">
            <table class="deals" id="recentTable">
              <thead>
                <tr>
                  <th>Сделка</th>
                  <th class="num">Сумма</th>
                  <th>Стадия</th>
                  <th>Ответственный</th>
                </tr>
              </thead>
              <tbody id="recentBody"></tbody>
            </table>
          </div>
        </section>
      </div>

      <footer class="foot" id="foot"></footer>
    </main>

    <script src="./app.js" type="module"></script>
  </body>
</html>
